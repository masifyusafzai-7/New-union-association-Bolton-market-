<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3f8a"><meta name="description" content="New Union Association of Bolton Market Digital Platform"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><title>New Union Association of Bolton Market</title><style>
:root{--blue:#0b3f8a;--blue2:#075bb5;--gold:#f4b800;--bg:#f4f7fb;--text:#10223e;--muted:#6d7b90;--green:#16a66a;--red:#e64b4b;--card:#fff;--shadow:0 8px 24px #173b6b12}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:76px}.top{background:linear-gradient(135deg,#063878,#0b5eb7);color:#fff;padding:18px 18px 20px;border-radius:0 0 24px 24px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px}.brand img{width:48px;height:48px;border-radius:50%;background:#fff}.brand h1{font-size:18px;margin:0}.brand small{opacity:.8}.lang{margin-left:auto;border:1px solid #ffffff55;background:#ffffff16;color:#fff;border-radius:18px;padding:6px 10px}.hello{margin-top:16px}.hello b{font-size:21px}.content{padding:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile,.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow)}.tile{padding:13px 6px;text-align:center;min-height:92px;cursor:pointer}.ico{width:38px;height:38px;border-radius:12px;background:#eaf2ff;color:var(--blue);display:grid;place-items:center;margin:0 auto 7px;font-size:20px}.tile span{font-size:11px;font-weight:700}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section h2{font-size:16px;margin:0}.section a{font-size:12px;color:var(--blue);font-weight:700}.card{padding:14px;margin-bottom:10px}.notice{display:flex;gap:12px;align-items:flex-start}.badge{font-size:10px;padding:4px 7px;border-radius:10px;background:#e8f7ef;color:#13834f}.muted{color:var(--muted);font-size:12px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid #e6ebf2;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.navbtn{border:0;background:none;color:#718096;font-size:10px}.navbtn.active{color:var(--blue);font-weight:800}.navbtn div{font-size:19px}.page{display:none}.page.active{display:block}.back{border:0;background:none;color:#fff;font-size:20px}.titlebar{display:flex;align-items:center;gap:10px}.titlebar h2{font-size:18px;margin:0}.form label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px}.form input,.form textarea,.form select{width:100%;border:1px solid #dce3ed;border-radius:11px;padding:11px;background:#fff;outline:none}.form textarea{min-height:110px}.primary{width:100%;border:0;border-radius:12px;background:var(--blue2);color:#fff;padding:12px;font-weight:800;margin-top:14px}.status{font-size:10px;border-radius:10px;padding:4px 7px;font-weight:700}.pending{background:#fff2d7;color:#b36d00}.progress{background:#e5f0ff;color:#075bb5}.resolved{background:#e5f8ee;color:#11834f}.fund{background:linear-gradient(135deg,#0aa56a,#087b50);color:#fff;border-radius:16px;padding:17px}.fund b{font-size:25px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf1f5;font-size:13px}.search{width:100%;border:1px solid #dce3ed;border-radius:12px;padding:11px;margin-bottom:10px}.member{display:flex;align-items:center;gap:11px}.avatar{width:42px;height:42px;border-radius:50%;background:#eaf2ff;display:grid;place-items:center;color:var(--blue);font-weight:800}.chat{min-height:360px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:82%;padding:11px 13px;border-radius:15px;font-size:13px}.bot{background:#eaf2ff;align-self:flex-start}.me{background:var(--blue);color:#fff;align-self:flex-end}.chatbox{display:flex;gap:8px}.chatbox input{flex:1;border:1px solid #dce3ed;border-radius:12px;padding:11px}.chatbox button{width:46px;border:0;border-radius:12px;background:var(--blue);color:#fff}.login{min-height:100vh;display:grid;place-items:center;padding:25px;background:linear-gradient(150deg,#062f68,#0b5bb0)}.loginbox{background:#fff;border-radius:24px;padding:24px;width:min(410px,100%);box-shadow:0 20px 50px #001d4533}.loginbox img{display:block;width:90px;margin:0 auto 8px}.loginbox h1{text-align:center;color:var(--blue);font-size:20px}.loginbox p{text-align:center;color:var(--muted);font-size:12px}.admin{max-width:1100px;margin:auto;padding:20px}.admin .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;padding:16px;border-radius:14px;box-shadow:var(--shadow)}.stat b{display:block;font-size:23px;color:var(--blue)}@media(max-width:700px){.admin .stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id="root"></div><script>
const logo='assets/logo.png';let lang='EN';let current='home';let complaints=[{id:'#BMU-2026-0045',cat:'Cleaning / Sanitation',desc:'Garbage is not being collected near Gate 2.',status:'Pending'},{id:'#BMU-2026-0044',cat:'Electricity',desc:'Main market light issue.',status:'In Progress'},{id:'#BMU-2026-0043',cat:'Security',desc:'Need additional security patrol.',status:'Resolved'}];
const t=(en,ur)=>lang==='EN'?en:ur;
function shell(){document.getElementById('root').innerHTML=`<div class="app"><div class="top"><div class="brand"><img src="${logo}"><div><h1>New Union Association of Bolton Market</h1><small>Digital Management Platform</small></div><button class="lang" onclick="toggleLang()">${lang==='EN'?'اردو':'EN'}</button></div><div class="hello"><b>${t('Welcome, Muhammad Asif','خوش آمدید، محمد آصف')}</b><div class="muted" style="color:#d9e8ff">${t('Member ID: BMU-000123 • Shop No. 45','ممبر آئی ڈی: BMU-000123 • دکان نمبر 45')}</div></div></div><main class="content"><div id="pages"></div></main><nav class="bottom"><button class="navbtn ${current==='home'?'active':''}" onclick="go('home')"><div>⌂</div>${t('Home','ہوم')}</button><button class="navbtn ${current==='complaints'?'active':''}" onclick="go('complaints')"><div>▣</div>${t('Complaints','شکایات')}</button><button class="navbtn ${current==='notices'?'active':''}" onclick="go('notices')"><div>🔔</div>${t('Notices','اعلانات')}</button><button class="navbtn ${current==='more'?'active':''}" onclick="go('more')"><div>☰</div>${t('More','مزید')}</button></nav></div>`;render();}
function go(p){current=p;shell()};function toggleLang(){lang=lang==='EN'?'UR':'EN';shell()}
function render(){let p=document.getElementById('pages');if(current==='home')p.innerHTML=home();if(current==='complaints')p.innerHTML=complaintsPage();if(current==='notices')p.innerHTML=notices();if(current==='more')p.innerHTML=more();if(current==='fund')p.innerHTML=fund();if(current==='directory')p.innerHTML=directory();if(current==='committee')p.innerHTML=committee();if(current==='legal')p.innerHTML=legal();if(current==='ai')p.innerHTML=ai();if(current==='profile')p.innerHTML=profile();if(current==='cameras')p.innerHTML=cameras();}
function home(){return `<div class="grid">${[['👤','My Profile','profile'],['🛠️','Complaints','complaints'],['💰','Market Fund','fund'],['📢','Notices','notices'],['📇','Directory','directory'],['⚖️','Legal Help','legal'],['👥','Committee','committee'],['📹','Security Cameras','cameras'],['🤖','AI Assistant','ai']].map(x=>`<div class="tile" onclick="go('${x[2]}')"><div class="ico">${x[0]}</div><span>${t(x[1],x[1])}</span></div>`).join('')}</div><div class="section"><h2>${t('Recent Announcements','حالیہ اعلانات')}</h2><a onclick="go('notices')">${t('View all','سب دیکھیں')}</a></div>${['Market Cleaning Schedule','Electricity Maintenance','General Meeting Notice'].map((x,i)=>`<div class="card notice"><div class="ico" style="margin:0">📣</div><div style="flex:1"><b>${x}</b><div class="muted">${12-i*2} Sep 2026</div></div><span class="badge">${t('New','نیا')}</span></div>`).join('')}`}
function complaintsPage(){return `<div class="section"><h2>${t('My Complaints','میری شکایات')}</h2><button class="primary" style="width:auto;margin:0;padding:8px 12px" onclick="go('newcomplaint')">+ ${t('New','نئی')}</button></div>${complaints.map(c=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${c.id}</b><span class="status ${c.status==='Resolved'?'resolved':c.status==='Pending'?'pending':'progress'}">${c.status}</span></div><div class="muted">${c.cat}</div><p style="font-size:13px">${c.desc}</p><div class="muted">Updated: 25 Sep 2026</div></div>`).join('')}<button class="primary" onclick="newComplaint()">${t('Submit a Complaint','شکایت درج کریں')}</button>`}
function newComplaint(){current='newcomplaint';shell();document.getElementById('pages').innerHTML=`<div class="titlebar" style="color:var(--blue);margin-bottom:15px"><button class="back" style="color:var(--blue)" onclick="go('complaints')">←</button><h2>${t('Submit Complaint','شکایت درج کریں')}</h2></div><div class="card form"><label>${t('Category','کیٹیگری')}</label><select><option>Cleaning / Sanitation</option><option>Security</option><option>Electricity</option><option>Water / Sewerage</option><option>Road / Infrastructure</option><option>Legal / Private</option><option>Administrative</option></select><label>${t('Location','مقام')}</label><input placeholder="Shop No. 45 / Gate 2"><label>${t('Description','تفصیل')}</label><textarea placeholder="Describe the issue..."></textarea><label>${t('Photo (optional)','تصویر (اختیاری)')}</label><input type="file" accept="image/*"><button class="primary" onclick="alert('Demo complaint submitted: #BMU-2026-0046');go('complaints')">${t('Submit','جمع کریں')}</button></div>`}
function notices(){return `<div class="section"><h2>${t('Notices & Announcements','اعلانات')}</h2></div>${['Market Cleaning Schedule','Electricity Maintenance','General Meeting Notice','Security Alert','New Market Rules'].map((x,i)=>`<div class="card"><b>${x}</b><div class="muted">${25-i*3} Sep 2026 • ${t('Official notice','سرکاری اعلان')}</div><p style="font-size:13px">${t('Tap to read the complete announcement and instructions.','مکمل اعلان اور ہدایات دیکھنے کے لیے کلک کریں۔')}</p></div>`).join('')}`}
function fund(){return `<div class="section"><h2>${t('Market Fund','مارکیٹ فنڈ')}</h2></div><div class="fund"><div>${t('Current Balance','موجودہ بیلنس')}</div><b>Rs. 2,450,000</b></div><div class="card" style="margin-top:12px"><div class="row"><b>${t('This Month Collection','اس ماہ وصولی')}</b><span style="color:var(--green)">Rs. 325,000</span></div><div class="row"><b>${t('This Month Expenses','اس ماہ اخراجات')}</b><span style="color:var(--red)">Rs. 210,000</span></div></div><div class="section"><h2>${t('Recent Transactions','حالیہ ٹرانزیکشنز')}</h2></div>${[['Member Collection','+ Rs. 50,000','green'],['Cleaning Service','- Rs. 35,000','red'],['Security Service','- Rs. 60,000','red'],['Electricity Bill','- Rs. 18,600','red']].map(x=>`<div class="card row"><span>${x[0]}</span><b style="color:var(--${x[2]})">${x[1]}</b></div>`).join('')}`}
function directory(){let m=['Royal Traders','Cosmetics Wholesale','Pak Packaging','Al-Rehman Transport','Noor Cosmetics','City General Store'];return `<div class="section"><h2>${t('Business Directory','کاروباری ڈائریکٹری')}</h2></div><input class="search" placeholder="${t('Search business...','کاروبار تلاش کریں...')}">${m.map((x,i)=>`<div class="card member"><div class="avatar">${x[0]}</div><div><b>${x}</b><div class="muted">Shop No. ${18+i} • Verified Member</div></div></div>`).join('')}`}
function committee(){return `<div class="section"><h2>${t('Committee','کمیٹی')}</h2></div>${[['Zahid Khan','President'],['Bilal Khan','Vice President'],['Sharifullah','Security In-charge'],['Yasin Memon','Finance Secretary'],['Nasir Khan','Legal Adviser']].map(x=>`<div class="card member"><div class="avatar">${x[0][0]}</div><div><b>${x[0]}</b><div class="muted">${x[1]}</div></div><span style="margin-left:auto">›</span></div>`).join('')}`}
function legal(){return `<div class="section"><h2>${t('Legal Assistance','قانونی معاونت')}</h2></div>${['Police / Legal Issue','Rental / Property Dispute','Government Department','Market Dispute','Other Legal Matters'].map(x=>`<div class="card"><b>⚖️ ${x}</b><div class="muted">${t('Submit a confidential legal request to the committee.','کمیٹی کو خفیہ قانونی درخواست جمع کریں۔')}</div></div>`).join('')}<button class="primary">${t('Create Legal Request','قانونی درخواست بنائیں')}</button>`}
function ai(){return `<div class="section"><h2>🤖 ${t('AI Assistant','اے آئی اسسٹنٹ')}</h2></div><div class="card chat"><div class="bubble bot">${t("Hello! I'm your Market AI Assistant. Ask about complaints, notices, fund or committee services.",'السلام علیکم! میں بولٹن مارکیٹ کا اے آئی اسسٹنٹ ہوں۔ شکایات، اعلانات، فنڈ یا کمیٹی سروسز کے بارے میں پوچھیں۔')}</div><div class="bubble me">${t('How can I submit a complaint?','میں شکایت کیسے درج کروں؟')}</div><div class="bubble bot">${t('Open Complaints → New Complaint, select a category, add the location and details, then submit.','شکایات → نئی شکایت کھولیں، کیٹیگری منتخب کریں، مقام اور تفصیل دیں اور جمع کریں۔')}</div></div><div class="chatbox"><input placeholder="${t('Type your question...','اپنا سوال لکھیں...')}"><button>➤</button></div>`}
function profile(){return `<div class="section"><h2>${t('My Profile','میرا پروفائل')}</h2></div><div class="card member"><div class="avatar">MA</div><div><b>Muhammad Asif</b><div class="muted">Member ID: BMU-000123</div><div class="muted">Shop No. 45 • Cosmetics</div></div></div>${['Personal Information','Shop Information','Membership Details','My Dues','Payment History','Documents'].map(x=>`<div class="card row"><span>${x}</span><b>›</b></div>`).join('')}`}
function more(){return `<div class="section"><h2>${t('Services','سروسز')}</h2></div>${[['💰','Market Fund','fund'],['📇','Business Directory','directory'],['👥','Committee','committee'],['📹','Security Cameras','cameras'],['⚖️','Legal Assistance','legal'],['🤖','AI Assistant','ai'],['👤','My Profile','profile']].map(x=>`<div class="card member" onclick="go('${x[2]}')"><div class="ico" style="margin:0">${x[0]}</div><div><b>${x[1]}</b><div class="muted">Open service</div></div><span style="margin-left:auto">›</span></div>`).join('')}`}

function cameras(){return `<div class="section"><h2>📹 ${t('Security Cameras','سکیورٹی کیمرے')}</h2><span class="badge">${t('Demo view','ڈیمو ویو')}</span></div><div class="card"><b>${t('Market CCTV Monitoring','مارکیٹ CCTV نگرانی')}</b><p class="muted">${t('Camera tiles are demo placeholders. Live video requires authorized connection to the market CCTV/NVR system.','کیمرہ ٹائلز فی الحال ڈیمو ہیں۔ لائیو ویڈیو کے لیے مارکیٹ کے CCTV/NVR سسٹم سے مجاز کنکشن ضروری ہے۔')}</p></div>${[['📹','Main Gate Camera','Gate 1'],['📹','Market Road Camera','Main Road'],['📹','Wholesale Lane Camera','Lane A'],['📹','Parking Camera','Parking Area']].map((x,i)=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>${x[1]}</b><span class="status ${i===1?'progress':'pending'}">${i===1?'Connection pending':'Demo offline'}</span></div><div style="height:130px;margin-top:10px;border-radius:12px;background:linear-gradient(145deg,#092d54,#174c77);display:grid;place-items:center;color:#fff;font-size:34px">▣<div style="font-size:11px;grid-column:1; margin-top:-35px">${x[2]} • CCTV Preview</div></div><div class="muted" style="margin-top:8px">${t('Access restricted to authorized committee/security staff.','رسائی صرف مجاز کمیٹی اور سکیورٹی عملے کے لیے ہے۔')}</div><button class="primary" onclick="alert('Demo only: connect an authorized CCTV/NVR system to enable live video.')">${t('Open Camera','کیمرہ کھولیں')}</button></div>`).join('')}`}

function login(){document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox"><img src="${logo}"><h1>New Union Association of Bolton Market</h1><p>Digital Platform for Members & Market Management</p><div class="form"><label>Mobile Number</label><input placeholder="03XX XXXXXXX"><label>Password</label><input type="password" placeholder="••••••••"><button class="primary" onclick="shell()">Login</button><button class="primary" style="background:#fff;color:var(--blue);border:1px solid var(--blue)" onclick="shell()">Login with OTP</button></div></div></div>`};login(); if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script></body></html>
